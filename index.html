<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050505; /* ดำสนิทแบบ High-end */
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* เอฟเฟกต์พื้นหลังเป็นจุดๆ แบบ Matrix/Tech */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            opacity: 0.5;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* Profile Section */
        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-wrapper:hover .profile-img {
            transform: rotate(5deg) scale(1.05);
            border-color: #ffffff;
        }

        h1 {
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-weight: 200;
            font-size: 0.85rem;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
        }

        /* Buttons Layout */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 400;
            transition: all 0.3s ease;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* ลูกเล่นขีดสีขาวตอน Hover */
        .btn::after {
            content: "";
            position: absolute;
            left: 0; bottom: 0;
            width: 0; height: 2px;
            background: #ffffff;
            transition: width 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn:hover::after {
            width: 100%;
        }

        /* Footer / Social Icons */
        .social-icons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            opacity: 0.6;
        }

        .social-icons a {
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            transition: opacity 0.3s;
        }

        .social-icons a:hover {
            opacity: 1;
        }

    </style>
</head>
<body>

<div class="wrapper">
    <div class="profile-wrapper">
        <!-- ใส่ URL รูปโปรไฟล์ของคุณตรงนี้ -->
        <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">
    </div>
    
    <h1>Soluna 1998s SLi</h1>
    <div class="subtitle">Soluna AL50 Enthusiast | Digital Creator</div>

    <div class="links">
        <a href="#" class="btn">PORTFOLIO</a>
        <a href="#" class="btn">AUTOMOTIVE PROJECT</a>
        <a href="#" class="btn">YOUTUBE</a>
        <a href="#" class="btn">CONTACT</a>
    </div>

    <div class="social-icons">
        <a href="#">IG</a>
        <a href="#">FB</a>
        <a href="#">X</a>
    </div>
</div>

</body>
</html>
